services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORNERSCOUT_DATA_DIR: /data
      CORNERSCOUT_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - ./data/interim/02_clean:/data/interim/02_clean:ro
      - ./data/interim/03_scr15:/data/interim/03_scr15:ro
      - ./data/processed/04_features:/data/processed/04_features:ro
      - ./data/processed/05_modeling:/data/processed/05_modeling:ro
      - ./data/processed/runs:/data/processed/runs
