[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cornerscout"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "pyarrow>=19", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
ml = ["scikit-learn>=1.6,<2", "matplotlib>=3.9", "joblib>=1.4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34", "duckdb>=1.2,<2"]
llm = ["google-genai>=1,<3"]

[project.scripts]
cornerscout = "analytics.cli:main"

[tool.setuptools.packages.find]
include = ["analytics*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
